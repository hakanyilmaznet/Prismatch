<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Prismatch">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#121a3a"></stop>
      <stop offset="1" stop-color="#0b1020"></stop>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"></feDropShadow>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"></feDropShadow>
    </filter>

    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366F1"></stop>
      <stop offset="0.35" stop-color="#22C55E"></stop>
      <stop offset="0.7" stop-color="#F59E0B"></stop>
      <stop offset="1" stop-color="#EC4899"></stop>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"></rect>

  <!-- 3x3 palette -->
  <g filter="url(#shadow)">
    <g transform="translate(46,46)">
      <!-- cell size 38, gap 10 -->
      <rect x="0" y="0" width="38" height="38" rx="10" fill="#6366F1" opacity="0.95"></rect>
      <rect x="48" y="0" width="38" height="38" rx="10" fill="#22C55E" opacity="0.95"></rect>
      <rect x="96" y="0" width="38" height="38" rx="10" fill="#F59E0B" opacity="0.95"></rect>

      <rect x="0" y="48" width="38" height="38" rx="10" fill="#EC4899" opacity="0.95"></rect>
      <rect x="48" y="48" width="38" height="38" rx="10" fill="#0EA5E9" opacity="0.95"></rect>
      <rect x="96" y="48" width="38" height="38" rx="10" fill="#A855F7" opacity="0.95"></rect>

      <rect x="0" y="96" width="38" height="38" rx="10" fill="#E74C3C" opacity="0.95"></rect>
      <rect x="48" y="96" width="38" height="38" rx="10" fill="#F1C40F" opacity="0.95"></rect>

      <!-- bottom-right: clicked -->
      <rect x="96" y="96" width="38" height="38" rx="10" fill="#95A5A6" opacity="0.95"></rect>
      <!-- subtle focus ring around clicked cell -->
      <rect x="92" y="92" width="46" height="46" rx="14" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.95"></rect>
    </g>

    <!-- click ripple (center of bottom-right cell) -->
    <!-- bottom-right cell center = (46+96+19, 46+96+19) = (161,161) -->
    <g opacity="0.95">
      <circle cx="161" cy="161" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"></circle>
      <circle cx="161" cy="161" r="10" fill="#FFFFFF" fill-opacity="0.85"></circle>
      <circle cx="161" cy="161" r="4.5" fill="#0b1020" fill-opacity="0.9"></circle>
    </g>

    <!-- cursor clicking bottom-right cell -->
    <g filter="url(#soft)">
      <!-- cursor body (classic arrow) -->
      <!-- tip positioned near the ripple center -->
      <path d="M140 112 L140 172 L156 156 L166 178 L178 172 L168 150 L186 150 Z" fill="#FFFFFF" fill-opacity="0.95"></path>
      <!-- cursor outline -->
      <path d="M140 112 L140 172 L156 156 L166 178 L178 172 L168 150 L186 150 Z" fill="none" stroke="#0b1020" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"></path>
    </g>
  </g>

  <!-- subtle highlight -->
  <path d="M40 78c22-26 55-40 91-40 12 0 24 2 35 5" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="10" stroke-linecap="round"></path>
</svg>
